[package]
name = "signal-activator-nexus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526949b043f921b6d3ce115b7f455291f2e2", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598025984f8a73e70aa18b8e8a6fdfdfdfd8", optional = true }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "1976e45fe1edfd5676cb33919dba1ec20c785a02" }

[lints.rust]
unsafe_code = "forbid"
